<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="大群路径：焦点决定谁进个人管线">
  <title>大群路径：焦点决定谁进个人管线</title>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
  </marker>
</defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .n { font-size: 12px; fill: #57606a; }
    .badge { font-size: 11.5px; font-weight: 600; }
    .arr { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1120" height="560" fill="#ffffff"/>
  <text x="40" y="42" class="h" >大群路径：焦点决定谁进个人管线</text>
<text x="40" y="66" class="s" >群人数只影响名册查找；注入与判官调用由焦点上限决定。</text>
<rect x="40" y="104" width="170" height="66" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.2"/>
<text x="58" y="132" class="t" >群消息</text>
<text x="58" y="154" class="s" >1000 个说话人也可以</text>
<path d="M 210 137 L 258 137" class="arr" />
<rect x="260" y="104" width="190" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="278" y="132" class="t" >噪音过滤</text>
<text x="278" y="154" class="s" >草 / 6666 / 表情 / 复读</text>
<text x="278" y="176" class="s" >直接 @ 或点名永远放行</text>
<path d="M 450 137 L 498 137" class="arr" />
<rect x="500" y="96" width="260" height="82" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="518" y="124" class="t" >焦点板</text>
<text x="518" y="146" class="s" >最近 60 条 · 6 小时</text>
<text x="518" y="164" class="s" >加权 importance + 发言轮数</text>
<path d="M 630 178 L 630 210" class="arr" />
<path d="M 530 178 L 530 210" class="arr" />
<path d="M 500 178 L 500 195 L 155 195 L 155 212" class="arr" />
<rect x="40" y="212" width="230" height="90" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="58" y="240" class="t" >active · 前 5 人</text>
<text x="58" y="264" class="s" >判官 + 事件 + 归纳/晋升</text>
<text x="58" y="282" class="s" >注入完整人物卡</text>
<rect x="292" y="212" width="230" height="90" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.2"/>
<text x="310" y="240" class="t" >buffer · 后 5 人</text>
<text x="310" y="264" class="s" >判官 + 事件，不归纳</text>
<text x="310" y="282" class="s" >晋升推迟，不建完整卡</text>
<rect x="544" y="212" width="230" height="90" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="562" y="240" class="t" >其他 · 第 11 人起</text>
<text x="562" y="264" class="s" >只进群氛围</text>
<text x="562" y="282" class="s" >不建个人事件</text>
<path d="M 155 302 L 155 340" class="arr" />
<path d="M 407 302 L 407 340" class="arr" />
<path d="M 659 302 L 659 340" class="arr" />
<rect x="40" y="342" width="734" height="82" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.2"/>
<text x="58" y="370" class="t" >群氛围归纳</text>
<text x="58" y="394" class="s" >每 20 条有效消息，且间隔 ≥180 秒；只读最近 20 条</text>
<text x="58" y="414" class="s" >输出：氛围 / 无人称事件 / 成员风格（均有字数上限）</text>
<path d="M 774 383 L 822 383" class="arr" />
<rect x="824" y="342" width="256" height="82" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="842" y="370" class="t" >群聊气泡（注入）</text>
<text x="842" y="394" class="s" >最多 8 人 / 6 条事件</text>
<text x="842" y="414" class="s" >固定上限，与群人数无关</text>
<rect x="40" y="452" width="1040" height="78" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="58" y="478" class="t" >事件去留</text>
<text x="58" y="500" class="s" >群事件活跃上限 20 条；溢出写 groups/&lt;id&gt;.archive.jsonl。个人事件活跃上限 400 条，归档可被 recall 检索。</text>
<text x="58" y="520" class="s" >代价：buffer 不归纳、第 11 人起只进群氛围；没有 direct 信号时插件无法判断普通群聊是否关键。</text>
<text x="40" y="552" class="n" >合成检查：1000 人 / 2000 条消息 → 注入 192 tokens、焦点 60 条、群成员 10 人、群事件 20 + 归档 70。</text>
</svg>
