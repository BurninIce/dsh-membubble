<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="单轮处理路径：私聊与 active 成员">
  <title>单轮处理路径：私聊与 active 成员</title>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
  </marker>
</defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .n { font-size: 12px; fill: #57606a; }
    .badge { font-size: 11.5px; font-weight: 600; }
    .arr { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1120" height="470" fill="#ffffff"/>
  <text x="40" y="42" class="h" >单轮处理路径：私聊 / active 成员</text>
<text x="40" y="66" class="s" >群聊先由焦点决定谁进入这条管线；见下一张图。</text>
<rect x="40" y="104" width="150" height="62" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.2"/>
<text x="58" y="132" class="t" >turn/end</text>
<text x="58" y="154" class="s" >一轮结束</text>
<path d="M 190 135 L 238 135" class="arr" />
<rect x="240" y="104" width="190" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="258" y="132" class="t" >pending 缓冲</text>
<text x="258" y="154" class="s" >立即落盘，不阻塞回复</text>
<path d="M 430 135 L 478 135" class="arr" />
<rect x="480" y="104" width="190" height="62" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="498" y="132" class="t" >判官：话题结束？</text>
<text x="498" y="154" class="s" >后台队列，失败保留缓冲</text>
<path d="M 480 135 L 440 135 L 440 208" class="arr" />
<rect x="250" y="208" width="190" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="268" y="234" class="t" >continue</text>
<text x="268" y="254" class="s" >继续缓冲，下一轮再判</text>
<path d="M 345 208 L 345 166" class="arr" />
<path d="M 670 135 L 718 135" class="arr" />
<rect x="720" y="104" width="160" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="738" y="132" class="t" >close · 不值得</text>
<text x="738" y="154" class="s" >丢弃缓冲</text>
<path d="M 575 166 L 575 300" class="arr" />
<rect x="470" y="302" width="210" height="62" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="488" y="330" class="t" >close · 值得</text>
<text x="488" y="352" class="s" >写一条事件，计数 +1</text>
<path d="M 680 333 L 728 333" class="arr" />
<rect x="730" y="302" width="180" height="62" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="748" y="330" class="t" >归纳 / 晋升</text>
<text x="748" y="352" class="s" >每 inductEvery 条事件</text>
<path d="M 575 364 L 575 400" class="arr" />
<rect x="400" y="402" width="230" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="418" y="426" class="t" >活跃事件 ≤ 400</text>
<text x="418" y="444" class="s" >超出部分写入归档</text>
<path d="M 630 428 L 690 428" class="arr" />
<rect x="692" y="402" width="250" height="52" rx="10" fill="#ffeff7" stroke="#bf3989" stroke-width="1.2"/>
<text x="710" y="426" class="t" >archive.jsonl → recall 可检索</text>
<text x="710" y="444" class="s" >高 importance 最后淘汰</text>
<text x="40" y="456" class="n" >溢出的事件不会静默消失：写归档后从活跃列表淘汰；归档写入失败时保留在活跃列表。</text>
</svg>
