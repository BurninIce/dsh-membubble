<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-label="三层记忆结构">
  <title>三层记忆结构</title>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
  </marker>
</defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .n { font-size: 12px; fill: #57606a; }
    .badge { font-size: 11.5px; font-weight: 600; }
    .arr { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="980" height="500" fill="#ffffff"/>
  <text x="40" y="42" class="h" >三层记忆结构</text>
<text x="40" y="66" class="s" >分层是存储结构；对外的三条硬约束见 README 开头。</text>
<rect x="240" y="92" width="500" height="108" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.2"/>
<text x="264" y="122" class="t" >L0  群聊气泡</text>
<text x="264" y="148" class="s" >群体氛围 · 无人称近期事件 · 成员名字与模糊风格（有则记）</text>
<text x="264" y="170" class="s" >不保存谁说了什么；已知成员名落盘前替换为「有人」</text>
<rect x="40" y="112" width="170" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="58" y="138" class="t" >群聊里所有人</text>
<text x="58" y="158" class="s" >可见的模糊印象</text>
<path d="M 490 200 L 490 240" class="arr" />
<text x="505" y="226" class="n" >晋升判定</text>
<text x="505" y="244" class="s" >importance + 互动次数</text>
<rect x="240" y="252" width="500" height="108" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="264" y="282" class="t" >L1  人物气泡</text>
<text x="264" y="308" class="s" >事件 · 事实 · 印象 · 自我披露 · 关系数值</text>
<text x="264" y="330" class="s" >按人隔离；只有当前说话人的文件会被读取和渲染</text>
<rect x="40" y="272" width="170" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="58" y="298" class="t" >只属于这个人</text>
<text x="58" y="318" class="s" >A 看不到 B 的卡片</text>
<path d="M 490 360 L 490 396" class="arr" />
<text x="505" y="382" class="n" >部署配置</text>
<text x="505" y="400" class="s" >不在本插件管理范围</text>
<rect x="240" y="406" width="500" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="264" y="432" class="t" >L2  完整人物卡</text>
<text x="264" y="452" class="s" >角色卡 / 人设层：由部署方的角色资产提供</text>
<text x="40" y="488" class="n" >注：group.buffer 是待归纳的短期原文，属于明文例外，见 README「三层」与「隐私」。</text>
</svg>
